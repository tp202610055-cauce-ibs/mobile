targets:
  $default:
    builders:
      json_serializable:
        options:
          # Los DTOs anidados se serializan explicitamente. Sin esto, un
          # objeto anidado se emite como instancia y no como Map, y
          # jsonEncode falla en runtime en vez de en compilacion.
          explicit_to_json: true
          # El backend responde camelCase y el cliente escribe camelCase.
          field_rename: none
          # Un campo desconocido en la respuesta no debe romper la app: el
          # backend puede agregar campos sin que el movil se entere.
          create_to_json: true

      # El cliente OpenAPI vive en su propio package (acta M20), asi que el
      # codegen de la app no debe intentar procesarlo.
      freezed:
        generate_for:
          exclude:
            - packages/**

      drift_dev:
        options:
          # Las fechas se guardan como texto ISO-8601 y no como segundos desde
          # epoch, que es el default de drift. Con el default, drift devuelve
          # DateTime en hora local y la marca de zona se pierde en el viaje:
          # `consumedAt` y `clientCreatedAt` viajan a un backend que valida
          # contra su propio reloj UTC, y la ventana de 4 horas que asocia un
          # sintoma con una comida se calcula sobre esos mismos valores. Un
          # desfase de zona ahi no es un detalle de formato, es un dato clinico
          # equivocado.
          #
          # Se activa ahora sin costo porque el esquema v1 no tenia tablas: no
          # hay fila existente que reinterpretar.
          store_date_time_values_as_text: true
