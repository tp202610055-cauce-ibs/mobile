name: cauce_mobile
description: "Cauce Mobile - Cliente Flutter para pacientes con SII"
publish_to: 'none'
# Cierre del bloque Mobile-1b (capa de identidad). Alinea con el tag
# v0.2.0-identity sobre develop, segun el acta M23.
version: 0.2.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # HTTP + OpenAPI
  dio: ^5.7.0

  # Cliente tipado generado desde openapi/openapi-v1.0.0.json.
  # Vive en su propio package por acta M20. Se regenera con:
  #   cd tools/openapi && npm run generate
  cauce_api_client:
    path: packages/cauce_api_client

  # Auth
  # flutter_appauth eliminado por acta M9: la autenticacion va por backend
  # passthrough (POST /api/v1/auth/login), no por PKCE directo a Keycloak.
  flutter_secure_storage: ^9.2.2

  # Persistencia local
  drift: ^2.20.0
  # Pin exacto por acta M22: el paquete esta EOL y 0.6.0+eol es un shim vacio.
  # Migracion a package:sqlite3 3.x diferida a Mobile-1.5 por acta M14.
  sqlite3_flutter_libs: 0.5.42
  path_provider: ^2.1.4
  path: ^1.9.0

  # Routing
  go_router: ^14.2.7

  # Iconografia del design system
  flutter_tabler_icons: ^1.43.0

  # Utilidades
  uuid: ^4.5.0
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # flutter_dotenv lee los archivos por rootBundle, asi que tienen que estar
  # declarados como assets aunque vivan en la raiz del proyecto.
  #
  # Los tres .env estan en .gitignore (R7), asi que en un clone limpio no
  # existen y el build falla por asset ausente. El workflow de CI los
  # materializa desde .env.example antes de analyze y test.
  assets:
    - .env.example
    - .env.dev
    - .env.staging
    - .env.prod

  # Fuentes empaquetadas, no descargadas en runtime. El diseno offline-first
  # exige que la app renderice identico sin red, y ademas hace deterministas
  # los golden tests (acta M18).
  #
  # El design system usa dos pesos principales, 400 y 500. Se declaran 600 y
  # 700 de Inter porque el theme los usa en titulos y etiquetas de boton.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Medium.ttf
          weight: 500
